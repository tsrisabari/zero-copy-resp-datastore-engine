[package]
name = "datastore"
version = "0.1.0"
edition = "2024"

[dependencies]
bytes = "1.6"
tokio={version = "1.0", features=["full"]}
tokio-util={version="0.7", features=["codec"]}
futures="0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-flame = "0.2"

[dev-dependencies]
proptest = "1.4"
